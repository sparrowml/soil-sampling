name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    # Do not send untrusted fork code to the private runner fleet.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, moviebox, soil-sampling]
    timeout-minutes: 20
    steps:
      - name: Verify disposable runner isolation
        run: |
          test ! -e /var/tmp/soil-sampling-ci-marker
          test ! -e /etc/moviebox-ci/github-token
          touch /var/tmp/soil-sampling-ci-marker
          echo "Runner: $RUNNER_NAME"
          echo "Machine: $(cat /etc/machine-id)"
          python3 - <<'PY'
          import socket
          for host, port in [('10.0.2.2', 22), ('100.113.66.30', 22), ('100.113.66.30', 5000)]:
              try:
                  connection = socket.create_connection((host, port), timeout=2)
              except OSError:
                  print(f'Private destination blocked: {host}:{port}')
              else:
                  connection.close()
                  raise SystemExit(f'Private destination unexpectedly reachable: {host}:{port}')
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install locked application dependencies
        run: python -m pip install -r requirements-main.txt pytest==8.3.5
      - name: Test CSV inputs and offline endpoints
        run: |
          python -m pytest -q soil_sampling/csv_upload_test.py
          python -m pytest -q soil_sampling/app_test.py -k 'uniform or order_points'
